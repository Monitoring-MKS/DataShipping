<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEK ISI KONTAINER - MKS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f0f2f5; padding: 0; margin: 0; }
        .window-frame { background-color: #fff; max-width: 800px; margin: auto; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .window-header { background: #2c3e50; color: white; padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Area Filter */
        .filter-area { padding: 5px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 8px; color: #777; margin-bottom: 1px; font-weight: bold; }
        input, select { padding: 2px 4px; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; height: 26px; outline: none; background: white; }
        input[readonly] { background: #eee; color: #555; border: 1px solid #ddd; }
        
        /* Tombol */
        .action-area { padding: 5px; background: #fff; display: flex; gap: 5px; }
        .btn-proses { border: none; padding: 6px; font-weight: bold; border-radius: 3px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 11px; width: 100%; color: white; }
        .btn-search { background-color: #2c3e50; flex: 2; }
        .btn-reset { background-color: #95a5a6; flex: 1; }

        /* Tabel Padat & Rapi */
        .table-container { flex: 1; overflow: auto; background: #fff; border-top: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        thead th { 
            background: #f1f3f5; padding: 6px 4px; border-bottom: 2px solid #2c3e50; 
            position: sticky; top: 0; text-align: left; font-size: 9px; color: #2c3e50; 
            text-transform: uppercase; z-index: 10; 
        }

        tbody td { 
            padding: 5px 4px; border-bottom: 1px solid #f1f1f1; font-size: 10px; 
            line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            cursor: pointer; 
        }

        /* Penyesuaian Lebar Kolom */
        .col-lok { width: 65px; font-weight: bold; color: #d35400; border-right: 1px solid #f9f9f9; }
        .col-plu { width: 75px; color: #444; }
        .col-desc { width: auto; white-space: normal; color: #222; font-size: 9px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .col-qty { width: 45px; background-color: #ebf5fb; color: #0d47a1; font-weight: bold; font-size: 12px; text-align: center; border-left: 1px solid #d6eaf8; }

        /* Highlight Baris */
        .row-highlight { background-color: #fff9c4 !important; transition: background 0.2s; }
        .row-highlight td { border-bottom: 1px solid #fbc02d; }

        /* Footer */
        .footer-qty { padding: 6px 15px; background: #2c3e50; color: white; display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="loader"><i class="fas fa-circle-notch fa-spin fa-2x" style="color:#2c3e50"></i></div>

<div class="window-frame">
    <div class="window-header">
        <span><i class="fas fa-shipping-fast"></i> CEK ISI KONTAINER V29.12.25.MKS</span>
        <div style="display: flex; gap: 10px; align-items: center;">
            <small id="lastSync" style="font-size: 8px; opacity: 0.8;"></small>
            <i class="fas fa-sync-alt" onclick="fetchData()" style="cursor:pointer"></i>
        </div>
    </div>

    <div class="filter-area">
        <div class="input-group"><label>TGL PROSES</label><select id="selTgl" onchange="lookupStore()"></select></div>
        <div class="input-group"><label>KODE TOKO</label><input type="text" id="inKdStore" oninput="lookupStore()"></div>
        <div class="input-group" style="grid-column: span 2;"><label>NAMA TOKO</label><input type="text" id="inNamaStore" readonly></div>
        <div class="input-group"><label>NO FAKTUR</label><select id="selFaktur"></select></div>
        <div class="input-group"><label>KONTAINER</label><select id="selKon"></select></div>
    </div>

    <div class="action-area">
        <button class="btn-proses btn-search" onclick="renderTable()">TAMPILKAN</button>
        <button class="btn-proses btn-reset" onclick="resetFilter()">RESET</button>
    </div>

    <div class="table-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th class="col-lok">LOK</th>
                    <th class="col-plu">PLU</th>
                    <th class="col-desc">DESKRIPSI</th>
                    <th class="col-qty">QTY</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer-qty">
        <span>TOTAL QTY</span>
        <span id="txtTotal">0</span>
    </div>
</div>

<script>
    let dbShipping = [];

    async function fetchData() {
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        const timestamp = new Date().getTime();

        try {
            const resConfig = await fetch(`config.json?nocache=${timestamp}`);
            const config = await resConfig.json();
            document.getElementById('lastSync').innerText = "Update: " + config.last_update.split(',')[0];

            const promises = [];
            for (let i = 1; i <= config.total_parts; i++) {
                promises.push(fetch(`data_part${i}.json?nocache=${timestamp}`).then(r => r.json()));
            }

            const allPartsData = await Promise.all(promises);
            dbShipping = allPartsData.flat();
            initTglDropdown();
        } catch (err) { 
            console.error("Gagal mengambil data:", err);
        } finally { 
            loader.style.display = 'none'; 
        }
    }

    function initTglDropdown() {
        const tglList = [...new Set(dbShipping.map(item => item.TGL_PROSES))].sort((a,b) => new Date(b) - new Date(a));
        document.getElementById('selTgl').innerHTML = '<option value="">Pilih</option>' + 
            tglList.map(tgl => `<option value="${tgl}">${tgl}</option>`).join('');
    }

    function lookupStore() {
        const tgl = document.getElementById('selTgl').value;
        const kd = document.getElementById('inKdStore').value.toUpperCase();
        const filtered = dbShipping.filter(item => item.KD_STORE === kd && item.TGL_PROSES === tgl);
        
        if (filtered.length > 0) {
            document.getElementById('inNamaStore').value = filtered[0].NAMA_STORE;
            document.getElementById('selFaktur').innerHTML = '<option value="">Pilih</option>' + 
                [...new Set(filtered.map(item => item.NO_FAKTUR))].map(f => `<option value="${f}">${f}</option>`).join('');
            document.getElementById('selKon').innerHTML = '<option value="">Pilih</option>' + 
                [...new Set(filtered.map(item => item.KONTAINER))].map(k => `<option value="${k}">${k}</option>`).join('');
        } else {
            document.getElementById('inNamaStore').value = "";
            document.getElementById('selFaktur').innerHTML = "";
            document.getElementById('selKon').innerHTML = "";
        }
    }

    function renderTable() {
        const tgl = document.getElementById('selTgl').value;
        const kd = document.getElementById('inKdStore').value.toUpperCase();
        const fkt = document.getElementById('selFaktur').value;
        const kon = document.getElementById('selKon').value;

        if (!tgl || !kd || !kon) return alert("Lengkapi filter (Tgl, Toko, Kontainer)");

        const data = dbShipping.filter(item => 
            item.TGL_PROSES === tgl && item.KD_STORE === kd && 
            (fkt === "" || item.NO_FAKTUR === fkt) && item.KONTAINER === kon
        ).sort((a,b) => (a.LOKASI || "").localeCompare(b.LOKASI || ""));

        const tbody = document.querySelector('#mainTable tbody');
        tbody.innerHTML = "";
        let total = 0;

        if (data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;padding:20px;'>Data tidak ditemukan</td></tr>";
            return;
        }

        data.forEach(row => {
            const q = parseFloat(row.QTY_SHIPPING) || 0;
            total += q;
            
            const tr = document.createElement('tr');
            tr.onclick = function() { toggleHighlight(this); }; 
            
            tr.innerHTML = `
                <td class="col-lok">${row.LOKASI || '-'}</td>
                <td class="col-plu">${row.PLU}</td>
                <td class="col-desc">${row.DESCP}</td>
                <td class="col-qty">${q}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('txtTotal').innerText = total.toLocaleString('id-ID');
    }

    function toggleHighlight(rowElement) {
        const activeRows = document.querySelectorAll('.row-highlight');
        activeRows.forEach(row => row.classList.remove('row-highlight'));
        rowElement.classList.add('row-highlight');
    }

    function resetFilter() {
        document.getElementById('selTgl').value = "";
        document.getElementById('inKdStore').value = "";
        document.getElementById('inNamaStore').value = "";
        document.getElementById('selFaktur').innerHTML = "";
        document.getElementById('selKon').innerHTML = "";
        document.querySelector('#mainTable tbody').innerHTML = "";
        document.getElementById('txtTotal').innerText = "0";
    }

    window.onload = fetchData;
</script>
</body>
</html>
