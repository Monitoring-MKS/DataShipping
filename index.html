<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CEK KONTAINER - MKS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Menggunakan dvh agar pas dengan layar HP */
        html, body { height: 100dvh; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #f0f2f5; }
        
        .window-frame { display: flex; flex-direction: column; height: 100dvh; max-width: 800px; margin: auto; background: #fff; }
        
        /* Header Super Tipis */
        .window-header { background: #2c3e50; color: white; padding: 4px 10px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        /* Area Filter Ramping */
        .filter-area { padding: 4px; background: #f8f9fa; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 2px; }
        .input-group label { font-size: 7px; color: #555; font-weight: bold; margin-bottom: 1px; text-transform: uppercase; }
        
        input, select { padding: 2px 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; height: 26px; outline: none; background: white; width: 100%; box-sizing: border-box; }
        input[readonly] { background: #e9ecef; color: #495057; }
        
        /* Tombol Compact */
        .action-area { padding: 4px; display: flex; gap: 4px; background: #fff; flex-shrink: 0; }
        .btn { border: none; padding: 6px; font-weight: bold; border-radius: 3px; cursor: pointer; font-size: 10px; width: 100%; color: white; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .btn-search { background-color: #2c3e50; flex: 2; }
        .btn-reset { background-color: #95a5a6; flex: 1; }

        /* Tabel Super Padat */
        .table-container { flex: 1; overflow-y: auto; background: #fff; border-top: 1px solid #eee; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; } 
        
        thead th { 
            background: #f1f3f5; padding: 4px 2px; border-bottom: 1px solid #2c3e50; 
            position: sticky; top: 0; text-align: left; font-size: 8px; color: #2c3e50; 
            z-index: 20; font-weight: bold;
        }

        /* Jarak antar baris diperkecil agar muat banyak */
        tbody td { 
            padding: 3px 2px; border-bottom: 1px solid #f1f1f1; font-size: 9px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            line-height: 1.1;
        }

        /* Ukuran kolom proporsional */
        .col-lok { width: 55px; font-weight: bold; color: #d35400; }
        .col-plu { width: 60px; color: #555; }
        .col-desc { width: auto; white-space: normal; color: #222; font-size: 8px; line-height: 1; }
        .col-qty { width: 35px; background-color: #ebf5fb; color: #0d47a1; font-weight: bold; text-align: center; font-size: 11px; }

        .row-highlight { background-color: #fff9c4 !important; }

        /* Footer Tetap Muncul di Bawah */
        .footer-qty { 
            padding: 6px 12px; background: #2c3e50; color: white; 
            display: flex; justify-content: space-between; font-weight: bold; 
            font-size: 12px; flex-shrink: 0;
            padding-bottom: calc(6px + env(safe-area-inset-bottom)); /* Untuk iPhone modern */
        }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

<div id="loader"><i class="fas fa-circle-notch fa-spin fa-2x" style="color:#2c3e50"></i></div>

<div class="window-frame">
    <div class="window-header">
        <span><i class="fas fa-shipping-fast"></i> CEK KONTAINER V1.12.25.MKS</span>
        <i class="fas fa-sync-alt" onclick="fetchData()" style="cursor:pointer"></i>
    </div>

    <div class="filter-area">
        <div class="filter-grid">
            <div class="input-group">
                <label>Tgl Proses</label>
                <select id="selTgl" onchange="lookupStore()"></select>
            </div>
            <div class="input-group">
                <label>Kode Toko</label>
                <input type="text" id="inKdStore" oninput="lookupStore()" placeholder="Ketik Kode">
            </div>
        </div>
        <div class="input-group" style="margin-top: 2px;">
            <input type="text" id="inNamaStore" readonly placeholder="Nama Toko">
        </div>
        <div class="filter-grid" style="margin-top: 2px;">
            <div class="input-group">
                <label>No Faktur</label>
                <select id="selFaktur"></select>
            </div>
            <div class="input-group">
                <label>Kontainer</label>
                <select id="selKon"></select>
            </div>
        </div>
    </div>

    <div class="action-area">
        <button class="btn btn-search" onclick="renderTable()">TAMPILKAN</button>
        <button class="btn btn-reset" onclick="resetFilter()">RESET</button>
    </div>

    <div class="table-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th class="col-lok">LOK</th>
                    <th class="col-plu">PLU</th>
                    <th class="col-desc">DESKRIPSI</th>
                    <th class="col-qty">QTY</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer-qty">
        <span>TOTAL QTY</span>
        <span id="txtTotal">0</span>
    </div>
</div>

<script>
    let dbShipping = [];

    async function fetchData() {
        document.getElementById('loader').style.display = 'flex';
        const cacheBuster = new Date().getTime(); 
        try {
            const resCfg = await fetch(`config.json?n=${cacheBuster}`);
            const cfg = await resCfg.json();
            const promises = [];
            for (let i = 1; i <= cfg.total_parts; i++) {
                promises.push(fetch(`data_part${i}.json?n=${cacheBuster}`).then(r => r.json()));
            }
            const allData = await Promise.all(promises);
            dbShipping = allData.flat();
            initTgl();
        } catch (e) { 
            console.error("Gagal memuat data:", e); 
        } finally { 
            document.getElementById('loader').style.display = 'none'; 
        }
    }

    function initTgl() {
        const tgls = [...new Set(dbShipping.map(x => x.TGL_PROSES))].sort((a,b) => new Date(b) - new Date(a));
        document.getElementById('selTgl').innerHTML = '<option value="">Pilih</option>' + tgls.map(t => `<option value="${t}">${t}</option>`).join('');
    }

function lookupStore() {
    const tgl = document.getElementById('selTgl').value;
    const kd = document.getElementById('inKdStore').value.toUpperCase();
    const f = dbShipping.filter(x => x.KD_STORE === kd && x.TGL_PROSES === tgl);
    
    if (f.length > 0) {
        document.getElementById('inNamaStore').value = f[0].NAMA_STORE;
        
        // Mengurutkan No Faktur secara alfabetis/angka
        const listFaktur = [...new Set(f.map(x => x.NO_FAKTUR))].sort();
        document.getElementById('selFaktur').innerHTML = '<option value="">Pilih</option>' + 
            listFaktur.map(x => `<option value="${x}">${x}</option>`).join('');
        
        // Mengurutkan Kontainer dari terkecil ke terbesar
        const listKon = [...new Set(f.map(x => x.KONTAINER))].sort();
        document.getElementById('selKon').innerHTML = '<option value="">Pilih</option>' + 
            listKon.map(x => `<option value="${x}">${x}</option>`).join('');
    }
}
    function renderTable() {
        const tgl = document.getElementById('selTgl').value;
        const kd = document.getElementById('inKdStore').value.toUpperCase();
        const kon = document.getElementById('selKon').value;
        if (!tgl || !kd || !kon) return alert("Lengkapi Filter!");

        const data = dbShipping.filter(x => x.TGL_PROSES === tgl && x.KD_STORE === kd && x.KONTAINER === kon)
                     .sort((a,b) => (a.LOKASI || "").localeCompare(b.LOKASI || ""));

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        let tot = 0;

        data.forEach(r => {
            const q = parseFloat(r.QTY_SHIPPING) || 0;
            tot += q;
            const tr = document.createElement('tr');
            tr.onclick = function() { 
                document.querySelectorAll('.row-highlight').forEach(el => el.classList.remove('row-highlight'));
                this.classList.add('row-highlight'); 
            };
            tr.innerHTML = `<td class="col-lok">${r.LOKASI || '-'}</td><td>${r.PLU}</td><td class="col-desc">${r.DESCP}</td><td class="col-qty">${q}</td>`;
            tbody.appendChild(tr);
        });
        document.getElementById('txtTotal').innerText = tot.toLocaleString();
    }

    function resetFilter() { location.reload(); }
    window.onload = fetchData;
</script>
</body>
</html>
