<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reporting Shipping v2 - Multi Part</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 2px; margin: 0; }
        .window-frame { background-color: #fff; border-radius: 4px; max-width: 800px; margin: auto; overflow: hidden; border: 1px solid #ccc; height: 100vh; display: flex; flex-direction: column; }
        .window-header { background: #2c3e50; color: white; padding: 8px 10px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .filter-area { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 9px; color: #666; margin-bottom: 2px; font-weight: bold; text-transform: uppercase; }
        input, select { padding: 4px 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; height: 32px; outline: none; background: white; }
        input[readonly] { background: #eee; color: #555; }
        .action-area { padding: 8px; background: #fff; display: flex; gap: 8px; }
        .btn-proses { border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 12px; transition: 0.2s; width: 100%; }
        .btn-search { background-color: #2c3e50; color: white; flex: 2; }
        .btn-reset { background-color: #95a5a6; color: white; flex: 1; }
        .table-container { flex: 1; overflow: auto; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        thead th { background: #fdfdfd; padding: 8px 5px; border-bottom: 2px solid #dee2e6; position: sticky; top: 0; text-align: left; font-size: 10px; color: #333; z-index: 10; }
        tbody td { padding: 8px 6px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .col-qty { background-color: #e3f2fd; color: #0d47a1; font-weight: bold; font-size: 13px; text-align: center; width: 50px; }
        .footer-qty { padding: 10px 15px; background: #2c3e50; color: white; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .load-text { margin-top: 10px; font-size: 12px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<div id="loader">
    <i class="fas fa-circle-notch fa-spin fa-2x" style="color:#2c3e50"></i>
    <div class="load-text">Memproses Data Besar...</div>
</div>

<div class="window-frame">
    <div class="window-header">
        <span><i class="fas fa-shipping-fast"></i> DETAIL SHIPPING MKS</span>
        <div style="display: flex; gap: 15px;">
            <small id="lastSync" style="font-size: 9px; opacity: 0.8;"></small>
            <i class="fas fa-sync" onclick="fetchData()" style="cursor:pointer" title="Sync Data"></i>
        </div>
    </div>

    <div class="filter-area">
        <div class="input-group"><label>TGL PROSES</label><select id="selTgl" onchange="lookupStore()"></select></div>
        <div class="input-group"><label>KODE TOKO</label><input type="text" id="inKdStore" placeholder="Ketik Kode Toko" oninput="lookupStore()"></div>
        <div class="input-group" style="grid-column: span 2;"><label>NAMA TOKO</label><input type="text" id="inNamaStore" readonly></div>
        <div class="input-group"><label>NO FAKTUR</label><select id="selFaktur"></select></div>
        <div class="input-group"><label>KONTAINER</label><select id="selKon"></select></div>
    </div>

    <div class="action-area">
        <button class="btn-proses btn-search" onclick="renderTable()">
            <i class="fas fa-search"></i> TAMPILKAN
        </button>
        <button class="btn-proses btn-reset" onclick="resetFilter()">
            <i class="fas fa-undo"></i> RESET
        </button>
    </div>

    <div class="table-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>LOKASI</th>
                    <th>PLU</th>
                    <th>DESKRIPSI</th>
                    <th style="text-align:center">QTY</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer-qty">
        <span>TOTAL QTY</span>
        <span id="txtTotal">0</span>
    </div>
</div>

<script>
    let dbShipping = [];

    // Fungsi Utama: Ambil Data Multi-Part
    async function fetchData() {
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        dbShipping = []; // Reset database lokal

        try {
            // 1. Ambil Config untuk tahu jumlah part
            const resConfig = await fetch("config.json?t=" + new Date().getTime());
            if (!resConfig.ok) throw new Error("Config tidak ditemukan. Silakan KIRIM DATA dari GSheet.");
            const config = await resConfig.json();
            
            document.getElementById('lastSync').innerText = "Update: " + config.last_update;

            // 2. Ambil semua part secara paralel
            const promises = [];
            for (let i = 1; i <= config.total_parts; i++) {
                promises.push(
                    fetch(`data_part${i}.json?t=` + new Date().getTime())
                    .then(r => {
                        if(!r.ok) throw new Error(`Gagal ambil part ${i}`);
                        return r.json();
                    })
                );
            }

            const allPartsData = await Promise.all(promises);
            
            // 3. Gabungkan semua part
            allPartsData.forEach(part => {
                dbShipping = dbShipping.concat(part);
            });

            console.log("Total Data Dimuat: " + dbShipping.length);
            initTglDropdown();

        } catch (err) { 
            alert("Error: " + err.message); 
        } finally { 
            loader.style.display = 'none'; 
        }
    }

    function initTglDropdown() {
        // Ambil tanggal unik dan urutkan terbaru di atas
        const tglList = [...new Set(dbShipping.map(item => item.TGL_PROSES))].sort((a,b) => new Date(b) - new Date(a));
        document.getElementById('selTgl').innerHTML = '<option value="">Pilih Tgl</option>' + 
            tglList.map(tgl => `<option value="${tgl}">${tgl}</option>`).join('');
    }

    function lookupStore() {
        const tgl = document.getElementById('selTgl').value;
        const kd = document.getElementById('inKdStore').value.toUpperCase();
        
        const match = dbShipping.find(item => item.KD_STORE === kd);
        if (match) {
            document.getElementById('inNamaStore').value = match.NAMA_STORE;
            const filtered = dbShipping.filter(item => item.TGL_PROSES === tgl && item.KD_STORE === kd);
            
            document.getElementById('selFaktur').innerHTML = '<option value="">Pilih</option>' + 
                [...new Set(filtered.map(item => item.NO_FAKTUR))].map(f => `<option value="${f}">${f}</option>`).join('');
            
            document.getElementById('selKon').innerHTML = '<option value="">Pilih</option>' + 
                [...new Set(filtered.map(item => item.KONTAINER))].map(k => `<option value="${k}">${k}</option>`).join('');
        } else {
            document.getElementById('inNamaStore').value = "";
        }
    }

    function resetFilter() {
        document.getElementById('selTgl').value = "";
        document.getElementById('inKdStore').value = "";
        document.getElementById('inNamaStore').value = "";
        document.getElementById('selFaktur').innerHTML = "";
        document.getElementById('selKon').innerHTML = "";
        document.querySelector('#mainTable tbody').innerHTML = "";
        document.getElementById('txtTotal').innerText = "0";
    }

    function renderTable() {
        const tgl = document.getElementById('selTgl').value;
        const kd = document.getElementById('inKdStore').value.toUpperCase();
        const fkt = document.getElementById('selFaktur').value;
        const kon = document.getElementById('selKon').value;

        if (!tgl || !kd || !kon) return alert("Lengkapi Filter!");

        const data = dbShipping.filter(item => 
            String(item.TGL_PROSES) === tgl && 
            String(item.KD_STORE) === kd && 
            String(item.NO_FAKTUR) === fkt && 
            String(item.KONTAINER) === kon
        ).sort((a,b) => (a.LOKASI || "").localeCompare(b.LOKASI || ""));

        const tbody = document.querySelector('#mainTable tbody');
        tbody.innerHTML = "";
        let total = 0;

        if (data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:20px;'>Data tidak ditemukan</td></tr>";
        }

        data.forEach(row => {
            const q = parseFloat(row.QTY_SHIPPING) || 0;
            total += q;
            tbody.innerHTML += `<tr>
                <td style="font-weight:bold; color:#d4a017">${row.LOKASI || '-'}</td>
                <td>${row.PLU}</td>
                <td style="white-space:normal; font-size:10px;">${row.DESCP}</td>
                <td class="col-qty">${q}</td>
            </tr>`;
        });
        document.getElementById('txtTotal').innerText = total.toLocaleString('id-ID');
    }

    window.onload = fetchData;
</script>
</body>
</html>
